<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>现货市场 - 广东电力市场交易系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; color: #333; }
        .header {
            background: #1e3c72; color: #fff; padding: 0 24px; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header .title { font-size: 16px; font-weight: bold; }
        .header .user { font-size: 13px; }
        .header .user a { color: #cfe2ff; margin-left: 12px; text-decoration: none; }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 200px; flex-shrink: 0; background: #2c3e50; color: #ecf0f1; padding: 12px 0; font-size: 14px; }
        .sidebar .group-title { padding: 10px 18px 6px; color: #95a5a6; font-size: 12px; letter-spacing: 1px; }
        .sidebar a { display: block; padding: 10px 18px 10px 30px; color: #ecf0f1; text-decoration: none; border-left: 3px solid transparent; }
        .sidebar a:hover { background: #34495e; }
        .sidebar a.active { background: #34495e; border-left-color: #3498db; color: #fff; font-weight: bold; }

        .main { flex: 1; padding: 18px 24px; min-width: 0; }
        .placeholder {
            background: #fff; border-radius: 4px; padding: 60px 24px;
            text-align: center; color: #888;
        }
        .placeholder h2 { font-size: 18px; color: #444; margin-bottom: 12px; }
        .placeholder .loading {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid #cfe2ff; border-top-color: #2a5298;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">广东电力市场交易系统 / 现货市场</div>
        <div class="user">
            欢迎，<b>{{ username }}</b>
            <a href="/logout">退出登录</a>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="group-title">账单中心</div>
            <a href="/daily_overview">日清算概览</a>
            <a href="/monthly_settlement">月清算汇总</a>
            <a href="/contract_power">合同电量</a>
            <div class="group-title">数据查询</div>
            <a href="/spot_clearance">现货出清电量</a>
            <a href="/market_demand">市场用电需求</a>
        </aside>

        <main class="main">
            <div class="placeholder">
                <h2>现货市场</h2>
                <div><span class="loading"></span>数据加载中...</div>
            </div>
        </main>
    </div>
</body>
</html>
