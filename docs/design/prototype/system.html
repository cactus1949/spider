<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>采集</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark">电</div>
    <a class="nav" href="personal.html">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      取数
    </a>
    <a class="nav on" href="system.html">
      <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      采集
    </a>
  </aside>
  <div>
    <header class="top">
      <div><span class="who">公有</span><span class="date">11月13日</span></div>
      <button class="btn">上传</button>
    </header>
    <div class="stage">
      <section class="card">
        <div class="legend">
          <span><i class="sw ok"></i>已到位</span>
          <span><i class="sw part"></i>部分到位</span>
          <span><i class="sw miss"></i>缺失</span>
          <span><i class="sw hatch"></i>未披露</span>
          <span><i class="sw upd"></i>更新</span>
        </div>
        <div class="grid" id="g" style="grid-template-columns: 148px repeat(6, 1fr)"></div>
      </section>
    </div>
  </div>
</div>
<script>
const heads = ["10月","11/9","11/10","11/11","11/12","11/13"];
const rows = [
  ["实时节点电价", "   ohh"],
  ["日前节点电价", "    oh"],
  ["分时分类型·日前", "    o "],
  ["分时分类型·实时", "    p "],
  ["分日出清量价", "    p "],
  ["披露预测", "    p "],
  ["披露实际", "    p "],
  ["市场用电", "    p "],
  ["日清算概况", "    p "],
  ["统一结算价", "    p "],
  ["月结算概览", "o     "],
  ["运行日报", "   oom"],
  ["交易日历", "     u"]
];
const g = document.getElementById("g");
const lab0 = document.createElement("div");
g.appendChild(lab0);
heads.forEach(h => { const d = document.createElement("div"); d.className = "h"; d.textContent = h; g.appendChild(d); });
rows.forEach(([name, pat]) => {
  const lab = document.createElement("div");
  lab.className = "lab";
  lab.textContent = name;
  g.appendChild(lab);
  pat.split("").forEach(ch => {
    const w = document.createElement("div");
    w.className = "cellw";
    if (ch !== " ") {
      const i = document.createElement("i");
      const map = {o:"ok", p:"part", h:"hatch", m:"miss", u:"ok upd"};
      i.className = "c " + map[ch];
      if (ch === "m") {
        i.classList.add("on");
        const pop = document.createElement("div");
        pop.className = "pop";
        pop.innerHTML = '<button class="btn sm">重取</button>';
        w.appendChild(i);
        w.appendChild(pop);
      } else w.appendChild(i);
    }
    g.appendChild(w);
  });
});
</script>
</body>
</html>
