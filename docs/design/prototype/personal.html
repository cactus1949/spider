<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>取数</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark">电</div>
    <a class="nav on" href="personal.html">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      取数
    </a>
    <a class="nav" href="system.html">
      <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      采集
    </a>
  </aside>
  <div>
    <header class="top">
      <div><span class="who">蕴阳海风场</span><span class="date">11月13日</span></div>
      <button class="btn">打开文件夹</button>
    </header>
    <div class="stage">
      <section class="card">
        <div class="legend">
          <span><i class="sw ok"></i>已到位</span>
          <span><i class="sw part"></i>部分到位</span>
          <span><i class="sw miss"></i>缺失</span>
          <span><i class="sw hatch"></i>未披露</span>
        </div>
        <div class="grid" style="grid-template-columns: 132px repeat(10, 1fr)">
          <div></div>
          <div class="h">11/5</div><div class="h">11/6</div><div class="h">11/7</div><div class="h">11/8</div><div class="h">11/9</div>
          <div class="h">11/10</div><div class="h">11/11</div><div class="h">11/12</div><div class="h">11/13</div><div class="h">11/14</div>
          <div class="lab">日前交易结果</div>
          <div class="cellw"></div><div class="cellw"></div><div class="cellw"></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c part on"></i><div class="pop"><button class="btn sm">重取</button></div></div>
          <div class="lab">实际运行结果</div>
          <div class="cellw"></div><div class="cellw"></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"></div><div class="cellw"></div>
          <div class="lab">信息披露实际</div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"><i class="c ok"></i></div>
          <div class="cellw"></div><div class="cellw"></div><div class="cellw"></div><div class="cellw"></div><div class="cellw"></div><div class="cellw"></div>
        </div>
        <div class="month">
          <div class="mrow"><span class="lab">日清结果</span><span class="h">10月</span><i class="c ok"></i></div>
          <div class="mrow"><span class="lab">月结算单</span><span class="h">10月</span><i class="c ok"></i></div>
        </div>
      </section>
    </div>
  </div>
</div>
</body>
</html>
